<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسائل حب</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="img/image-removebg-preview.png">
</head>
<body>

  <!-- القائمة والأزرار بالخارج فوق -->
  <header>
    <button id="start-button" class="modal-button">:> افتحي الرسالة</button>
    <nav aria-label="الأقسام">
      <ul class="tab-menu">
        <li class="tab-menu__item"><button type="button" class="tab-menu__button is-active" data-target="home">الرئيسية</button></li>
        <li class="tab-menu__item"><button type="button" class="tab-menu__button" data-target="memories">ذكرياتنا</button></li>
      </ul>
    </nav>
  </header>

  <!-- أقسام المحتوى التي تظهر وتختفي -->
  <main id="main-content" class="hidden">
    
    <!-- قسم الرئيسية -->
    <section id="home" class="tab-content active">
      <h2>أهلاً يا حبيبتي</h2>
      <p>ازيك يحبو عامله اي البيدج دي انا عاملها خصيصا عشانك عشان بحبك.</p>
    </section>

    <!-- قسم الذكريات -->
    <section id="memories" class="tab-content">
      <h2>ذكرياتنا الجميلة</h2>
      <div class="memory-card">
        <h3>ذكرى يوم ما اتقابلنا</h3>
        <p>اول يوم شوفتك في اللعبه حقيقي كان يوم حظي كان احلي يوم قضيته ف حياتي...</p>
        <span class="date">2025/12/27</span>
      </div>
      <div class="memory-card">
        <h3>ذكرى تانية</h3>
        <p>الزكريات الي مقدرش انساها ابدا لما بنخرج و نتفسح و نخش السنيما...</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
